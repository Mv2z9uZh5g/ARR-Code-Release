replicaCount: 2

env:
  - name: LOG_LEVEL
    value: "debug"
  - name: ENVIRONMENT
    value: "staging"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: data-api-db
        key: url
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: data-api-redis
        key: url

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
