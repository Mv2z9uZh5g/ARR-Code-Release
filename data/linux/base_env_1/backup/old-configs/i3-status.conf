general {
    colors = true
    interval = 5
    color_good = "#98c379"
    color_degraded = "#e5c07b"
    color_bad = "#e06c75"
}

order += "cpu_usage"
order += "memory"
order += "disk /"
order += "ethernet enp0s31f6"
order += "wireless wlan0"
order += "battery 0"
order += "volume master"
order += "tztime local"

cpu_usage {
    format = " CPU: %usage"
}

memory {
    format = " MEM: %used/%total"
    threshold_degraded = "10%"
    threshold_critical = "5%"
}

disk "/" {
    format = " DISK: %avail"
}

ethernet enp0s31f6 {
    format_up = " ETH: %ip"
    format_down = " ETH: down"
}

wireless wlan0 {
    format_up = " WIFI: %essid %quality"
    format_down = " WIFI: down"
}

battery 0 {
    format = " BAT: %percentage %status"
    low_threshold = 15
}

volume master {
    format = " VOL: %volume"
    format_muted = " VOL: muted"
}

tztime local {
    format = " %Y-%m-%d %H:%M"
}
