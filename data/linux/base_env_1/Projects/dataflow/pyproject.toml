[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow"
version = "2.4.1"
description = "ETL pipeline orchestration for DataCorp"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow>=2.8.0",
    "pandas>=2.1.0",
    "sqlalchemy>=2.0",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
    "pyarrow>=15.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3.0",
    "mypy>=1.8",
    "black>=24.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
